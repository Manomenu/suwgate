profiles: [library, dotnet]
steps:
  add:
    - name: dotnet-pack
      title: the .NET guard packages pack into .artifacts/nupkg (dotnet pack)
      run: dotnet pack Suwgate.slnx --nologo -v quiet -o .artifacts/nupkg
      after: [dotnet-test]
    - name: cli-from-dist
      title: the built CLI starts (node dist/cli.js --version after pnpm run build)
      run: pnpm run build >/dev/null && node dist/cli.js --version
      after: [publint]
exceptions:
  - guard: required-files
    target: layers.json
    reason: the .NET projects of suwgate are guard packages, not a layered server, so there are no layers to describe
  - guard: docs-paths
    target: docs/inventory.md
    reason: the inventory names files of the template and of suwfrontkit, and .NET guard ids such as architecture/layers, none of which are paths of suwgate
  - guard: docs-paths
    target: docs/dev.md
    reason: the dev guide maps the template's dev scripts (db.sh, logs.sh, server.sh and the rest) onto suwgate dev, so it names files of the consuming repositories
  - guard: docs-paths
    target: docs/ci.md
    reason: the CI guide shows a caller's workflow and git refs (origin/master, ./.github/workflows/... in a consuming repository), which are not paths of suwgate
  - guard: docs-paths
    target: README.md
    reason: the README is the user guide of the package, so it names files of the consuming repositories (contract/openapi.json, knip.config.ts, criteria.json) and preset entry points such as tsconfig/strict
settings:
  docs-paths:
    ignore: [NNNN-what-was-decided.md, NNNN_snake_case.sql, .artifacts/, architecture/, database/]
  dependency-direction:
    forbidden: ["@maniumek/suwfrontkit", "Suwbackkit.*"]
