profiles: [library, dotnet]
steps:
  add:
    - name: dotnet-pack
      title: the .NET guard packages pack into .artifacts/nupkg (dotnet pack)
      run: dotnet pack Suwgate.slnx --nologo -v quiet -o .artifacts/nupkg
      after: [dotnet-test]
    - name: cli-from-dist
      title: the built CLI starts (node dist/cli.js --version after pnpm run build)
      run: pnpm run build >/dev/null && node dist/cli.js --version
      after: [publint]
guards:
  skip:
    - guard: architecture/layers
      reason: the .NET projects of suwgate are guard packages, not a layered server, so there is no layers.json to check them against
    - guard: architecture/project-references
      reason: the allowed references live in layers.json, which suwgate does not have (see architecture/layers); its three projects reference each other in one direction only
    - guard: architecture/every-project-guarded
      reason: it checks that every project of layers.json is read and layered, and suwgate has no layers.json (see architecture/layers)
    - guard: architecture/endpoints
      reason: suwgate has no server and so no endpoints to map
exceptions:
  - guard: required-files
    target: layers.json
    reason: the .NET projects of suwgate are guard packages, not a layered server, so there are no layers to describe
  - guard: docs-paths
    target: docs/inventory.md
    reason: the inventory names files of the template and of suwfrontkit, which are not paths of suwgate
  - guard: docs-paths
    target: docs/dev.md
    reason: the dev guide maps the template's dev scripts (db.sh, logs.sh, server.sh and the rest) onto suwgate dev, so it names files of the consuming repositories
  - guard: docs-paths
    target: docs/ci.md
    reason: the CI guide shows a caller's workflow and git refs (origin/master, ./.github/workflows/... in a consuming repository), which are not paths of suwgate
  - guard: docs-paths
    target: README.md
    reason: the README is the user guide of the package, so it names files of the consuming repositories (contract/openapi.json, knip.config.ts, criteria.json) and preset entry points such as tsconfig/strict
  - guard: config-contents
    target: tsconfig.json
    reason: suwgate is where the tsconfig presets come from and does not install itself, so its own tsconfig cannot extend @maniumek/suwgate/tsconfig
  - guard: config-contents
    target: eslint.config.js
    reason: suwgate builds its eslint config from strict() of its own sources (src/eslint/index.ts), the code @maniumek/suwgate/eslint ships
  - guard: config-contents
    target: .prettierrc.json
    reason: suwgate does not install itself, so it cannot name the package's prettier preset; its .prettierrc.json holds the same options
  - guard: config-contents
    target: vitest.config.ts
    reason: suwgate does not install itself, and its tests are one Node project, not the unit and stories projects of an app
  - guard: config-contents
    target: .vscode/settings.json
    reason: VS Code reads suwgate's schema from its source, schema/suwgate.schema.json, since suwgate does not install itself
  - guard: config-contents
    target: .github/workflows
    reason: ci.yml calls the gate workflow of this same repository, ./.github/workflows/gate.yml, which runs at the caller's commit; a pin by sha would test an older gate
  - guard: test-timing
    target: src/guards/repository/hooks.test.ts
    message: "timeout:"
    reason: the timeout is a field of the Claude Code hooks settings the test builds as data, not a limit on the test
  - guard: test-timing
    target: src/guards/repository/testTiming.test.ts
    reason: the guard's own examples, the calls it must find, are strings of its test
settings:
  docs-paths:
    ignore: [NNNN-what-was-decided.md, NNNN_snake_case.sql, .artifacts/]
  dependency-direction:
    forbidden: ["@maniumek/suwfrontkit", "Suwbackkit.*"]
