name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

env:
  NODE_VERSION: 24.22.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml
    with:
      command: node src/cli.ts check --verbose
      dotnet: true

  release:
    if: github.event_name == 'push'
    needs: gate
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-npm.yml

  publish:
    if: needs.release.outputs.mode == 'publish'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: pnpm/action-setup v6.1.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: changesets/action/publish v2.1.2
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          pack-dir-artifact-id: ${{ needs.release.outputs.pack-dir-artifact-id }}
