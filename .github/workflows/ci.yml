name: ci

on:
  push:
    branches: [master]
    tags: ["nuget-v*"]
  pull_request:

permissions: {}

env:
  NODE_VERSION: 24.22.1

jobs:
  gate:
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    uses: ./.github/workflows/gate.yml
    with:
      command: node src/cli.ts check --verbose

  release:
    if: github.ref == 'refs/heads/master'
    needs: gate
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-npm.yml
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  publish:
    if: needs.release.outputs.mode == 'publish'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: pnpm/action-setup v6.1.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: changesets/action/publish v2.1.2
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          pack-dir-artifact-id: ${{ needs.release.outputs.pack-dir-artifact-id }}

  pack-nuget:
    if: startsWith(github.ref, 'refs/tags/nuget-v')
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/release-nuget.yml
    with:
      pack-target: Suwgate.slnx

  publish-nuget:
    if: startsWith(github.ref, 'refs/tags/nuget-v') && vars.NUGET_USER != ''
    needs: pack-nuget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget-org
    permissions:
      contents: read
      id-token: write
    steps:
      - name: actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nupkg
          path: nupkg
      - name: actions/setup-dotnet v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Every package carries exactly the version of the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#nuget-v}"
          shopt -s nullglob
          packages=(nupkg/*.nupkg)
          [ "${#packages[@]}" -eq 2 ] || { echo "expected Suwgate.Architecture and Suwgate.Database, found ${#packages[@]} packages" >&2; exit 1; }
          for package in "${packages[@]}"; do
            case "$package" in
              nupkg/Suwgate.Architecture."$version".nupkg | nupkg/Suwgate.Database."$version".nupkg) ;;
              *) echo "$package does not carry the tag's version $version: set Version in Directory.Build.props to $version and tag that commit" >&2; exit 1 ;;
            esac
          done
      - name: NuGet trusted publishing, a short-lived API key for this run (NuGet/login v1.2.0)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the packages and their symbols to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
