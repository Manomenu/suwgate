name: release-npm

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner label of every job, e.g. a self-hosted runner's label while the account's Actions minutes are used up
        type: string
        default: ubuntu-24.04
      node-version:
        type: string
        default: 24.22.1
      build-command:
        type: string
        default: pnpm run build
    secrets:
      release-app-private-key:
        description: The private key of the GitHub App whose token opens the Version Packages pull request, so its CI runs without an approval; its Client ID is the repository variable RELEASE_APP_CLIENT_ID. Without it the workflow's own token opens it
        required: false
    outputs:
      mode:
        value: ${{ jobs.select-mode.outputs.mode }}
      pack-dir-artifact-id:
        value: ${{ jobs.pack.outputs.pack-dir-artifact-id }}

permissions: {}

jobs:
  select-mode:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: pnpm/action-setup v6.1.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: changesets/action/select-mode v2.1.2
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: pnpm/action-setup v6.1.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: actions/create-github-app-token v3.4.0
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.release-app-private-key }}
          permission-contents: write
          permission-pull-requests: write
      - name: changesets/action/version v2.1.2
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: pnpm/action-setup v6.1.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: ${{ inputs.build-command }}
      - name: changesets/action/pack v2.1.2
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}
