name: gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner label of every job; empty takes the caller's repository variable CI_RUNNER (the self-hosted fallback), else ubuntu-24.04
        type: string
        default: ""
      command:
        description: The command that runs the gate from the repository root; empty runs suwgate check --verbose from the node_modules of working-directory
        type: string
        default: ""
      node-version:
        type: string
        default: 24.22.1
      working-directory:
        description: Folder of the package.json and the lockfile when they are not in the repository root
        type: string
        default: .
      browser:
        description: The Playwright browser the tests need, e.g. chromium, empty for none; its system packages are installed on GitHub-hosted runners only, a self-hosted runner brings its own
        type: string
        default: ""
      smoke:
        description: Build the compose stack and smoke-test it with suwgate dev smoke --ci, beside the gate on a GitHub-hosted runner and after it on a self-hosted one
        type: boolean
        default: false
      smoke-env:
        description: Variables the smoke test's compose stack needs, one NAME=value per line
        type: string
        default: ""
      consumer:
        description: A public repository (owner/name) that installs this repository's package; the gate job then runs that repository's gate, at its default branch or consumer-ref, against the package packed from this commit, instead of this repository's gate, and proof, stack and stamp are skipped; working-directory, browser, command and failure-artifacts then describe the consumer
        type: string
        default: ""
      consumer-ref:
        description: With consumer, the consumer's branch, tag or commit to test instead of its default branch, e.g. a branch that already adopts a breaking change of the package
        type: string
        default: ""
      package:
        description: With consumer, how the package is packed and installed there; npm packs it with pnpm pack and installs the tarball over the version the package.json of working-directory names; nuget packs it with dotnet pack at the version 0.0.0-consumer.<run id>.<attempt> into a local feed, pins the consumer's Directory.Packages.props to that version and re-locks
        type: string
        default: npm
      failure-artifacts:
        description: Paths kept as the artifact gate-failure when the gate fails (visual diffs, reports), one per line
        type: string
        default: |
          visual/results
          .artifacts/e2e
    outputs:
      proven:
        description: true when this push's tree had already passed (a ci/tree stamp of the same tree), so the gate and the smoke test were skipped
        value: ${{ jobs.proof.outputs.proven }}

permissions: {}

jobs:
  proof:
    if: inputs.consumer == ''
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    outputs:
      proven: ${{ steps.proof.outputs.proven }}
      tree: ${{ steps.proof.outputs.tree }}
      hosted: ${{ steps.proof.outputs.hosted }}
    steps:
      - name: Has this push's tree already passed? (a green ci/tree stamp of the same tree on this commit or on the head of its merged pull request; any doubt runs the full gate)
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -uo pipefail
          echo "hosted=$HOSTED" >> "$GITHUB_OUTPUT"
          tree="$(gh api "repos/$REPOSITORY/git/commits/$SHA" --jq .tree.sha)" || tree=""
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          stamped() {
            local descriptions
            descriptions="$(gh api "repos/$REPOSITORY/commits/$1/statuses?per_page=100" \
              --jq '.[] | select(.context == "ci/tree" and .state == "success") | .description')" && grep -qxF "$tree" <<< "$descriptions"
          }
          proven=false
          if [ "$EVENT" = push ] && [ -n "$tree" ]; then
            if stamped "$SHA"; then
              proven=true
              echo "proven: $SHA carries a green ci/tree stamp of its tree $tree"
            else
              heads="$(gh api "repos/$REPOSITORY/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | .head.sha')" || heads=""
              for head in $heads; do
                if stamped "$head"; then
                  proven=true
                  echo "proven: the head $head of the merged pull request carries a green ci/tree stamp of this tree $tree"
                  break
                fi
              done
            fi
          fi
          [ "$proven" = true ] || echo "not proven: the gate runs in full (event $EVENT, tree ${tree:-unknown})"
          echo "proven=$proven" >> "$GITHUB_OUTPUT"

  gate:
    needs: proof
    if: ${{ !cancelled() && needs.proof.outputs.proven != 'true' }}
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    concurrency:
      group: suwgate-gate-${{ github.workflow }}-${{ inputs.consumer }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    outputs:
      tree: ${{ steps.repository.outputs.tree }}
    env:
      CI: "1"
      CONSUMER_VERSION: 0.0.0-consumer.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - name: The consumer test's inputs fit together
        if: inputs.consumer != ''
        env:
          PACKAGE: ${{ inputs.package }}
          SMOKE: ${{ inputs.smoke }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in npm | nuget) ;; *) echo "package is '$PACKAGE': set it to npm or nuget" >&2; exit 1 ;; esac
          [ "$SMOKE" != true ] || { echo "smoke and consumer together: the consumer's stack would build images without the packed package, so drop smoke from the consumer call" >&2; exit 1; }
      - name: actions/checkout v7.0.1 (the consumer at its default branch or consumer-ref when consumer is set)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.consumer || github.repository }}
          ref: ${{ inputs.consumer-ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: actions/checkout v7.0.1 (this repository's package, inside the consumer until it is packed)
        if: inputs.consumer != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: .suwgate-package
          fetch-depth: 0
          persist-credentials: false
      - name: What the repository needs, and the tree under test
        id: repository
        run: |
          set -euo pipefail
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-files '*openapi.json')" ]; then echo "openapi=true" >> "$GITHUB_OUTPUT"; fi
      - name: pnpm/action-setup v6.1.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - name: actions/setup-node v7.1.0 (the pnpm cache on GitHub-hosted runners only; a self-hosted runner keeps its store)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: actions/setup-dotnet v6.0.0 (the NuGet cache on GitHub-hosted runners only; a self-hosted runner keeps its packages)
        if: hashFiles('global.json') != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: ${{ runner.environment == 'github-hosted' && hashFiles('**/packages.lock.json') != '' }}
          cache-dependency-path: "**/packages.lock.json"
      - name: actions/setup-dotnet v6.0.0 (the package's SDK, to pack it)
        if: inputs.consumer != '' && inputs.package == 'nuget'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: .suwgate-package/global.json
      - name: Pack the package into the runner's temp folder, then remove its checkout, which the consumer's guards would count as untracked files
        id: package
        if: inputs.consumer != ''
        env:
          PACKAGE: ${{ inputs.package }}
          FEED: ${{ runner.temp }}/suwgate-package
        run: |
          set -euo pipefail
          mkdir -p "$FEED"
          cd .suwgate-package
          if [ "$PACKAGE" = npm ]; then
            echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
            pnpm install --frozen-lockfile
            pnpm pack --pack-destination "$FEED"
          else
            dotnet pack -c Release -o "$FEED" --nologo -p:Version="$CONSUMER_VERSION" -p:MinVerVersionOverride="$CONSUMER_VERSION"
          fi
          cd ..
          rm -rf .suwgate-package
          ls -l "$FEED"
      - name: Install the npm package over the version the consumer names (package.json and lockfile, in the working tree only)
        if: inputs.consumer != '' && inputs.package == 'npm'
        working-directory: ${{ inputs.working-directory }}
        env:
          NAME: ${{ steps.package.outputs.name }}
          FEED: ${{ runner.temp }}/suwgate-package
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("$FEED"/*.tgz)
          [ "${#tarballs[@]}" -eq 1 ] || { echo "pnpm pack left ${#tarballs[@]} tarballs in $FEED, expected one" >&2; exit 1; }
          node -e '
            const fs = require("node:fs");
            const [name, tarball] = process.argv.slice(1);
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const field = ["dependencies", "devDependencies", "optionalDependencies"].find((group) => manifest[group]?.[name] !== undefined);
            if (field === undefined) {
              console.error("package.json of the consumer does not depend on " + name + ": set working-directory to the folder whose package.json names it");
              process.exit(1);
            }
            console.log(field + "." + name + ": " + manifest[field][name] + " -> file:" + tarball);
            manifest[field][name] = "file:" + tarball;
            fs.writeFileSync("package.json", JSON.stringify(manifest, null, 4) + "\n");
          ' "$NAME" "${tarballs[0]}"
          pnpm install --no-frozen-lockfile
      - name: Pin the consumer's NuGet packages to the packed version and re-lock with the local feed as an extra source, which puts the packages in the global packages folder for the gate's own restores (Directory.Packages.props and packages.lock.json, in the working tree only)
        if: inputs.consumer != '' && inputs.package == 'nuget'
        env:
          FEED: ${{ runner.temp }}/suwgate-package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=("$FEED"/*."$CONSUMER_VERSION".nupkg)
          [ "${#packages[@]}" -gt 0 ] || { echo "dotnet pack left no package of version $CONSUMER_VERSION in $FEED: the package's projects must take Version (or MinVerVersionOverride) from the command line" >&2; exit 1; }
          [ -f Directory.Packages.props ] || { echo "the consumer has no Directory.Packages.props: the consumer test pins NuGet packages through central package management" >&2; exit 1; }
          pinned=0
          for package in "${packages[@]}"; do
            id="$(basename "$package" ".$CONSUMER_VERSION.nupkg")"
            grep -q "<PackageVersion Include=\"$id\" " Directory.Packages.props || continue
            sed -i -E "s|(<PackageVersion Include=\"$id\" Version=\")[^\"]*\"|\1$CONSUMER_VERSION\"|" Directory.Packages.props
            grep -q "<PackageVersion Include=\"$id\" Version=\"$CONSUMER_VERSION\"" Directory.Packages.props \
              || { echo "Directory.Packages.props names $id without Version right after Include: write it as <PackageVersion Include=\"$id\" Version=\"…\" />" >&2; exit 1; }
            echo "$id -> $CONSUMER_VERSION"
            pinned=$((pinned + 1))
          done
          [ "$pinned" -gt 0 ] || { echo "Directory.Packages.props of the consumer pins none of the packed packages (${packages[*]##*/}): is this the right consumer?" >&2; exit 1; }
          CI="" dotnet restore --force-evaluate --nologo -p:RestoreAdditionalProjectSources="$FEED"
      - name: Install the packages
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile
      - name: Install the browser's system packages (GitHub-hosted runners only; a self-hosted runner brings its own)
        if: inputs.browser != '' && runner.environment == 'github-hosted'
        working-directory: ${{ inputs.working-directory }}
        env:
          BROWSER: ${{ inputs.browser }}
        run: pnpm exec playwright install-deps "$BROWSER"
      - name: Install the browser
        if: inputs.browser != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          BROWSER: ${{ inputs.browser }}
        run: pnpm exec playwright install "$BROWSER"
      - name: Install gitleaks and shellcheck (pinned, checksum verified, in the runner's temp folder because the repository guards count every untracked file, and without root so a self-hosted runner needs no sudo), so the gate never skips them
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir -p bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          install gitleaks bin/gitleaks
          curl -sSfL -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum --check
          tar -xJf shellcheck.tar.xz
          install shellcheck-v0.11.0/shellcheck bin/shellcheck
      - name: Install oasdiff (pinned, checksum verified, next to gitleaks) when the repository tracks an openapi.json
        if: steps.repository.outputs.openapi == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -sSfL -o oasdiff.tar.gz https://github.com/oasdiff/oasdiff/releases/download/v1.35.0/oasdiff_1.35.0_linux_amd64.tar.gz
          echo "a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140  oasdiff.tar.gz" | sha256sum --check
          tar -xzf oasdiff.tar.gz oasdiff
          install oasdiff bin/oasdiff
      - name: The gate
        run: ${{ inputs.command || format('"{0}/node_modules/.bin/suwgate" check --verbose', inputs.working-directory) }}
      - name: The stack, built and smoke-tested after the gate on a self-hosted runner (suwgate dev smoke --ci)
        if: inputs.smoke && needs.proof.outputs.hosted != 'true'
        env:
          SMOKE_ENV: ${{ inputs.smoke-env }}
          SUWGATE: ${{ inputs.working-directory }}/node_modules/.bin/suwgate
        run: |
          set -euo pipefail
          while IFS= read -r variable; do [ -z "$variable" ] || export "${variable?}"; done <<< "$SMOKE_ENV"
          "$SUWGATE" dev smoke --ci
      - name: Keep the failure files (actions/upload-artifact v7.0.2)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gate-failure
          path: ${{ inputs.failure-artifacts }}
          if-no-files-found: ignore

  stack:
    needs: proof
    if: inputs.smoke && inputs.consumer == '' && needs.proof.outputs.hosted == 'true' && needs.proof.outputs.proven != 'true'
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    concurrency:
      group: suwgate-stack-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
    env:
      CI: "1"
    steps:
      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: The tree under test
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: pnpm/action-setup v6.1.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - name: actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: Install the packages (for suwgate)
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile
      - name: The stack, built and smoke-tested beside the gate on a GitHub-hosted runner (suwgate dev smoke --ci)
        env:
          SMOKE_ENV: ${{ inputs.smoke-env }}
          SUWGATE: ${{ inputs.working-directory }}/node_modules/.bin/suwgate
        run: |
          set -euo pipefail
          while IFS= read -r variable; do [ -z "$variable" ] || export "${variable?}"; done <<< "$SMOKE_ENV"
          "$SUWGATE" dev smoke --ci

  stamp:
    needs: [proof, gate, stack]
    if: >-
      ${{ !cancelled() && needs.proof.result == 'success' && needs.proof.outputs.tree != ''
      && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.proof.outputs.proven == 'true'))
      && (needs.stack.result == 'success' || needs.stack.result == 'skipped') }}
    runs-on: ${{ inputs.runs-on || vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Stamp the tree that passed as the commit status ci/tree (on a pull request its head, on a push the commit), so a push of the same tree skips the gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
          PROVEN_TREE: ${{ needs.proof.outputs.tree }}
          GATE_TREE: ${{ needs.gate.outputs.tree }}
          STACK_TREE: ${{ needs.stack.outputs.tree }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          tree="${GATE_TREE:-$PROVEN_TREE}"
          if [ "$tree" != "$PROVEN_TREE" ] || { [ -n "$STACK_TREE" ] && [ "$STACK_TREE" != "$tree" ]; }; then
            echo "::warning::no ci/tree stamp: the jobs saw different trees (commit $PROVEN_TREE, gate ${GATE_TREE:-none}, stack ${STACK_TREE:-none}), so the next push runs the full gate"
            exit 0
          fi
          gh api -X POST "repos/$REPOSITORY/statuses/$TARGET" -f state=success -f context=ci/tree -f description="$tree" -f target_url="$RUN_URL" --silent \
            && echo "stamped $TARGET with the tree $tree" \
            || echo "::warning::no ci/tree stamp on $TARGET (the token may not write statuses, e.g. on a fork's pull request), so the next push of this tree runs the full gate"
