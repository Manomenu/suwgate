name: renovate

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Open and update pull requests now, outside the Monday schedule"
        type: boolean
        default: false
      debug:
        description: "Log at debug level"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: actions/create-github-app-token v3.4.0
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: List the repositories the App reaches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api /installation/repositories --paginate -q '.repositories[].full_name'

      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: renovatebot/github-action v46.3.14
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774
        with:
          configurationFile: .github/renovate-global.json
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.257.9
        env:
          LOG_LEVEL: ${{ inputs.debug && 'debug' || 'info' }}
          RENOVATE_FORCE: ${{ inputs.now && '{"schedule":[]}' || '{}' }}

  holds:
    if: vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: actions/create-github-app-token v3.4.0
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: pnpm/action-setup v6.1.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - name: actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Merge the open pull request that moves the holds once its checks pass, else open one when a hold moved
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: renovate-holds/update
        run: |
          set -euo pipefail
          open="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -n "$open" ]; then
            checks="$(gh pr checks "$open" --json bucket -q '[.[].bucket] | unique | join(" ")' || true)"
            if [ -n "$checks" ] && ! grep -qE 'fail|pending|cancel' <<<"$checks"; then
              gh pr merge "$open" --merge --delete-branch
            else
              echo "#$open waits for its checks: ${checks:-none yet}"
            fi
            exit 0
          fi
          pnpm install --frozen-lockfile
          changes="$(./ci/renovate-holds.sh --update)"
          if [ -z "$changes" ]; then
            echo "every hold follows its peer range"
            exit 0
          fi
          git config user.name "manomenu-release-bot[bot]"
          git config user.email "359565579+manomenu-release-bot[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -a -m "Move the version holds of the Renovate preset" -m "$changes"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --base master --head "$BRANCH" --title "Move the version holds of the Renovate preset" --body "$changes"
